[versions]
android-compileSdk = "37"
uniconv = "3.0.0"

activityCompose = "1.13.0"
compose = "1.12.2"
compose-lifecycle = "2.11.0"
compose-bom = "2026.09.00"
coreKtx = "1.19.1"
coroutines = "1.11.0"
datastorePreferences = "1.3.0"
junit-params = "6.1.3"
kotlin = "2.4.21"
agp = "9.4.1"
kotlinx-serialization = "1.12.0"
material3 = "1.9.0"
adaptive = "1.3.0"
systemsCommon = "2.2.1.1"

[libraries]
kotlin-gradle = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect", version.ref = "kotlin" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
kotlinx-coroutines = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "coroutines" }
junit-jupiter-params = { module = "org.junit.jupiter:junit-jupiter-params", version.ref = "junit-params" }

androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastorePreferences" }
androidx-lifecycle-viewmodel = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "compose-lifecycle" }

compose-bom = { module = "androidx.compose:compose-bom", version.ref="compose-bom" }
compose-activity = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
compose-resources = { module = "org.jetbrains.compose.components:components-resources", version.ref = "compose" }
material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "material3" }
material3-adaptive = { module = "org.jetbrains.compose.material3.adaptive:adaptive", version.ref = "adaptive" }
runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "compose" }

systems-common = { module = "systems.uom:systems-common", version.ref = "systemsCommon" }

[plugins]
android-application = {id = "com.android.application", version.ref = "agp" }
kotlin-multiplatform = {id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
compose-compiler = {id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = {id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
compose = {id = "org.jetbrains.compose", version.ref = "compose"}
android-kmp = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
